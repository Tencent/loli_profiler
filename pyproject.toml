[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcli"
version = "0.1.0"
description = "CLI for LoliProfiler heap data exploration."
requires-python = ">=3.10"
authors = [{ name = "LoliProfiler contributors" }]
readme = "agentcli/README.md"
dependencies = []  # tree_model uses only stdlib + re

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
loli = "agentcli.cli:main"
agentcli = "agentcli.cli:main"

[tool.setuptools]
packages = ["agentcli"]
